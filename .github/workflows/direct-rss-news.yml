name: Direct RSS News Aggregator

on:
  schedule:
    # 每天 UTC 时间 0 点和 12 点运行（北京时间 8 点和 20 点）
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggregate-and-publish-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          pnpm install --frozen-lockfile
          echo "✅ Dependencies installed successfully"

      - name: Generate news posts from RSS
        run: |
          echo "📝 Generating news posts from RSS sources..."
          node scripts/chinese-english-rss-aggregator.cjs

      - name: Check for changes
        id: git-check
        run: |
          echo "🔍 Checking for changes..."
          git add -A
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Changes detected"
            git diff --staged --name-only
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          echo "💾 Committing and pushing changes..."
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "🤖 Auto-publish: Add latest crypto news from RSS feeds"
          git push
          echo "✅ Changes committed and pushed successfully"