name: Direct RSS News Aggregator

on:
  schedule:
    # 每天 UTC 时间 0 点运行（北京时间 8 点）
    - cron: '0 0 * * *'
    # 每小时运行一次（用于测试）
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  aggregate-and-publish-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm install
          echo "✅ Dependencies installed successfully"

      - name: Generate news posts from RSS
        run: |
          echo "📝 Generating news posts from RSS sources..."
          node scripts/direct-rss-news-aggregator.cjs

      - name: Check for changes
        id: git-check
        run: |
          echo "🔍 Checking for changes..."
          git diff --exit-code src/content/blog/crypto-news/ || echo "changed=true" >> $GITHUB_OUTPUT
          if [ "${{ steps.git-check.outputs.changed }}" = "true" ]; then
            echo "✅ Changes detected"
          else
            echo "ℹ️ No changes detected"
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          echo "💾 Committing and pushing changes..."
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/content/blog/crypto-news/
          git add src/content/blog/en/crypto-news/
          git commit -m "Auto-publish: Add latest news articles from RSS"
          git push
          echo "✅ Changes committed and pushed successfully"