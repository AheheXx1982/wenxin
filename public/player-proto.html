<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>播放器最小化 · 太空人极简原型（3 变体对比）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #f8fafc 0%, #eef2f7 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
    color: #1e293b;
  }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #64748b; margin-bottom: 30px; text-align: center; max-width: 640px; line-height: 1.7; }
  .sub b { color: #7c3aed; }

  .variants { display: flex; gap: 44px; flex-wrap: wrap; justify-content: center; }
  .variant {
    display: flex; flex-direction: column; align-items: center;
    background: #ffffff; border-radius: 20px; padding: 28px 34px 22px;
    box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
    border: 1px solid rgba(148, 163, 184, 0.18);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .variant:hover { transform: translateY(-4px); box-shadow: 0 14px 40px rgba(15, 23, 42, 0.12); }
  .variant h3 { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .variant .desc { font-size: 11px; color: #94a3b8; margin-bottom: 18px; }
  .stage {
    position: relative;
    width: 200px; height: 200px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 16px;
    background:
      radial-gradient(circle at 50% 20%, rgba(148, 163, 184, 0.10), transparent 60%),
      repeating-radial-gradient(circle at 50% 50%, rgba(148, 163, 184, 0.06) 0 1px, transparent 1px 26px);
    border: 1px dashed rgba(148, 163, 184, 0.3);
  }
  .scale-note { position: absolute; top: 6px; right: 8px; font-size: 10px; color: #94a3b8; }
  .hint { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font-size: 10px; color: #94a3b8; }

  /* ============ 播放器本体 = 太空人头盔（2x 放大展示，实际 60px） ============ */
  .player {
    position: relative;
    width: 120px; height: 120px;          /* 2x 原型 */
    border-radius: 50%;
    border: 4px solid rgba(192, 132, 252, 0.55);
    background: radial-gradient(circle at 50% 16%, #2a2a3a 0%, #15151e 55%, #08080c 100%);
    box-shadow:
      inset 0 -4px 12px rgba(255, 255, 255, 0.06),
      inset 0 4px 16px rgba(0, 0, 0, 0.6),
      0 0 24px rgba(192, 132, 252, 0.22),
      0 6px 18px rgba(0, 0, 0, 0.3);
    cursor: pointer;
    user-select: none;
    transition: transform .15s ease;
    z-index: 5;
  }
  .player:active { transform: scale(0.97); }
  .player .gloss {
    position: absolute; top: 6px; left: 10%;
    width: 80%; height: 22px; border-radius: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.3) 65%, rgba(255,255,255,0) 100%);
    z-index: 2; pointer-events: none;
  }
  .screen {
    position: absolute; inset: 10px; border-radius: 44%;
    overflow: hidden;
    background: rgba(2, 6, 23, 0.85);
    display: flex; align-items: center; justify-content: center;
  }
  .screen::after {  /* 扫描线 */
    content: ''; position: absolute; inset: 0; z-index: 3; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 6px);
  }

  /* 层：眼睛 */
  .layer-eyes { position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; }
  .eye {
    width: 36px; height: 36px; border-radius: 48%;
    background: #ffffff; border: 3px solid #8b5cf6;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  .eye .pupil { width: 17px; height: 17px; border-radius: 50%; background: #000; position: relative; }
  .eye .pupil::after { content: ''; position: absolute; top: 15%; left: 26%; width: 4px; height: 4px; border-radius: 50%; background: #fff; }
  .eye:hover { transform: scale(1.15); }

  /* 层：播放（歌名 + EQ） */
  .layer-play { position: absolute; inset: 0; z-index: 1; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .track { width: 78px; overflow: hidden; white-space: nowrap; text-align: center; }
  .track span { display: inline-block; font-size: 13px; color: #67e8f9; letter-spacing: .3px; animation: scroll 5s linear infinite; text-shadow: 0 0 6px rgba(34,211,238,.6); }
  @keyframes scroll { 0% { transform: translateX(78px); } 100% { transform: translateX(-100%); } }
  .eq { display: flex; align-items: flex-end; gap: 4px; height: 18px; }
  .eq i { width: 5px; height: 7px; background: #4ade80; border-radius: 2px; animation: bounce .8s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: .15s; } .eq i:nth-child(3) { animation-delay: .3s; }
  .eq i:nth-child(4) { animation-delay: .45s; } .eq i:nth-child(5) { animation-delay: .6s; }
  @keyframes bounce { 0%,100% { height: 7px; } 50% { height: 18px; } }

  /* 层：悬停菜单 */
  .layer-menu { position: absolute; inset: 0; z-index: 4; display: none; align-items: center; justify-content: space-between; padding: 0 6px; background: rgba(2,6,23,0.92); }
  .menu-btn {
    width: 16px; height: 26px; display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: #67e8f9; background: transparent; border: none; cursor: pointer;
    transition: color .2s, transform .2s;
  }
  .menu-btn:hover { color: #fff; transform: scale(1.35); }

  /* 状态切换 */
  .player.playing .layer-eyes { display: none; }
  .player.playing .layer-play { display: flex; }
  .player:hover .layer-eyes, .player.playing:hover .layer-play { display: none; }
  .player:hover .layer-menu { display: flex; }

  /* ============ 变体附加元素 ============ */
  /* V2: 淡紫腰带 */
  .band { position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%); width: 92px; height: 10px; border-radius: 50%; background: rgba(192,132,252,0.35); z-index: 4; pointer-events: none; }
  /* V3: 金新月底座 */
  .moon {
    position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%);
    width: 116px; height: 60px; z-index: 1; pointer-events: none;
    background: radial-gradient(circle at 30% 35%, #fef08a 0%, #fbbf24 55%, #d97706 100%);
    border-radius: 50%;
    box-shadow: inset -12px -16px 24px rgba(180,83,9,0.5), 0 4px 16px rgba(0,0,0,0.25);
  }
  .moon::before, .moon::after { content: ''; position: absolute; border-radius: 50%; background: rgba(217,119,6,0.55); }
  .moon::before { left: 20px; top: 14px; width: 12px; height: 12px; }
  .moon::after { left: 46px; top: 30px; width: 8px; height: 8px; }
  /* V3: 淡紫光环（呼吸光晕） */
  .halo {
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    border: 4px solid rgba(192, 132, 252, 0.25);
    z-index: 0;
    pointer-events: none;
    animation: haloPulse 2.6s ease-in-out infinite;
  }
  @keyframes haloPulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.08); opacity: 1; }
  }

  .tag { margin-top: 14px; font-size: 11px; color: #64748b; background: #f1f5f9; border-radius: 999px; padding: 4px 12px; }
  .tag.playing-tag { color: #059669; background: #d1fae5; }
</style>
</head>
<body>

<h1>🚀 播放器最小化 · 太空人极简原型</h1>
<div class="sub">
  3 个变体（2x 放大展示，实际为 60px 圆球）。<b>点击球体</b>切换播放/暂停（面罩显示歌名+EQ），<b>鼠标悬停</b>面罩显示操作菜单。
  <br>变体差异仅在附加元素：无 / +淡紫腰带 / +金色新月底座。
</div>

<div class="variants" id="variants"></div>

<script>
  const SONGS = ['星际漫游 - 静谧夜空', '月球漫步 - Dreamy', '银河列车 - 星尘'];
  const VARIANTS = [
    { name: 'V1 · 纯头盔', desc: '黑玻璃头盔 + 大眼（无附件）', extra: '' },
    { name: 'V2 · 头盔 + 金新月', desc: '头盔坐月牙，太空氛围', extra: '<div class="moon"></div>' },
    { name: 'V3 · 头盔 + 紫光环', desc: '淡紫呼吸光环，科技感', extra: '<div class="halo"></div>' },
  ];
  const MENU_HTML = `
    <button class="menu-btn" title="上一首">⏮</button>
    <button class="menu-btn menu-play" title="播放/暂停">▶</button>
    <button class="menu-btn" title="下一首">⏭</button>
    <button class="menu-btn" title="展开">⏏</button>
    <button class="menu-btn" title="关闭">✕</button>`;

  const root = document.getElementById('variants');

  VARIANTS.forEach((v, vi) => {
    const card = document.createElement('div');
    card.className = 'variant';
    card.innerHTML = `
      <h3>${v.name}</h3>
      <div class="desc">${v.desc}</div>
      <div class="stage">
        <span class="scale-note">2x</span>
        <div class="player" data-v="${vi}">
          ${v.extra}
          <div class="gloss"></div>
          <div class="screen">
            <div class="layer-eyes">
              <div class="eye"><div class="pupil"></div></div>
              <div class="eye"><div class="pupil"></div></div>
            </div>
            <div class="layer-play">
              <div class="track"><span class="track-text"></span></div>
              <div class="eq"><i></i><i></i><i></i><i></i><i></i></div>
            </div>
            <div class="layer-menu">${MENU_HTML}</div>
          </div>
        </div>
        <div class="hint">点击=播放/暂停 · 悬停=菜单</div>
      </div>
      <div class="tag">待机 · 大眼睛</div>`;

    const player = card.querySelector('.player');
    const tag = card.querySelector('.tag');
    const trackText = card.querySelector('.track-text');
    const menuPlay = card.querySelector('.menu-play');
    let playing = false;
    let song = 0;

    function setPlaying(p) {
      playing = p;
      player.classList.toggle('playing', p);
      tag.textContent = p ? '播放中 · 歌名 + EQ' : '待机 · 大眼睛';
      tag.classList.toggle('playing-tag', p);
      if (p) { trackText.textContent = SONGS[song]; menuPlay.textContent = '⏸'; }
      else { menuPlay.textContent = '▶'; }
    }
    function nextSong() { song = (song + 1) % SONGS.length; if (playing) trackText.textContent = SONGS[song]; }

    player.addEventListener('click', () => setPlaying(!playing));
    card.querySelectorAll('.menu-btn').forEach((b, bi) => {
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        const act = b.title;
        if (act === '播放/暂停') setPlaying(!playing);
        else if (act === '下一首') nextSong();
        else if (act === '上一首') { song = (song - 1 + SONGS.length) % SONGS.length; if (playing) trackText.textContent = SONGS[song]; }
        else if (act === '展开') alert('（原型）展开播放器 → 完整界面');
        else if (act === '关闭') alert('（原型）关闭播放器');
      });
    });

    root.appendChild(card);
  });
</script>
</body>
</html>
