<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 剑柄护手 (cross-guard) -->
  <rect x="16" y="18" width="16" height="4" rx="2" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="18" y="14" width="12" height="4" rx="1.5" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- 剑柄缠绕 -->
  <line x1="22" y1="14" x2="22" y2="6" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="26" y1="14" x2="26" y2="6" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="22" y="4" width="4" height="3" rx="1" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- 剑身 (blade) -->
  <path d="M22 22 L24 40 L26 22" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="24" y1="22" x2="24" y2="38" stroke="#f1f5f9" stroke-width="1" opacity="0.6"/>
  <!-- 剑尖 -->
  <path d="M24 38 L22 42 L24 44 L26 42 Z" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- 寒光闪烁 -->
  <circle cx="24" cy="22" r="12" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="10;16;10" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.05;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
