<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="swordGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="bladeGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景光辉 -->
  <circle cx="60" cy="60" r="50" fill="url(#swordGlow)">
    <animate attributeName="r" values="45;55;45" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 外环 - 剑气流转 -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="#64748b" stroke-width="1" opacity="0.4"/>
  <circle cx="60" cy="60" r="38" fill="none" stroke="#06b6d4" stroke-width="0.5" opacity="0.3" stroke-dasharray="8 4">
    <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- 八边形剑阵纹路 -->
  <polygon points="60,22 87,33 98,60 87,87 60,98 33,87 22,60 33,33" fill="none" stroke="#475569" stroke-width="0.8" opacity="0.5"/>

  <!-- 中心剑 -->
  <g filter="url(#bladeGlow)">
    <!-- 剑柄 -->
    <rect x="56" y="40" width="8" height="3" rx="1" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="57" y="35" width="6" height="5" rx="1" fill="none" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="59" y1="35" x2="59" y2="28" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="61" y1="35" x2="61" y2="28" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="59" y="26" width="2" height="2" rx="0.5" fill="none" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- 剑身 -->
    <path d="M56 43 L60 85 L64 43" fill="none" stroke="#f1f5f9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="60" y1="43" x2="60" y2="82" stroke="#fff" stroke-width="0.8" opacity="0.5"/>

    <!-- 剑尖 -->
    <path d="M60 82 L57 89 L60 92 L63 89 Z" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- 剑穗 -->
    <path d="M55 40 Q48 50 52 58" stroke="#ef4444" stroke-width="1.2" fill="none" opacity="0.7">
      <animate attributeName="d" values="M55 40 Q48 50 52 58;M55 40 Q42 52 50 62;M55 40 Q48 50 52 58" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 四角铭文点 -->
  <circle cx="60" cy="20" r="1.5" fill="#06b6d4" opacity="0.6"/>
  <circle cx="60" cy="100" r="1.5" fill="#06b6d4" opacity="0.6"/>
  <circle cx="20" cy="60" r="1.5" fill="#06b6d4" opacity="0.6"/>
  <circle cx="100" cy="60" r="1.5" fill="#06b6d4" opacity="0.6"/>
</svg>
